<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏚️ 幽灵公寓</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
body {
  background: #0d0d1a;
  color: #c8c8d4;
  font-family: 'Microsoft YaHei', sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  overflow: hidden;
}
#gameContainer {
  width: 100%;
  height: 100vh;
  background: #1a1a2e;
  border: 3px solid #6b5b95;
  border-radius: 20px;
  position: relative;
  overflow: hidden;
  box-shadow: 0 0 40px rgba(107, 91, 149, 0.3);
}
#startScreen {
  position: absolute;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, #0d0d1a 0%, #1a1a2e 100%);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 100;
}
#startScreen h1 {
  font-size: 42px;
  color: #ff6b8a;
  text-shadow: 0 0 25px rgba(255, 107, 138, 0.6);
  margin-bottom: 10px;
  letter-spacing: 4px;
}
.subtitle { color: #8888a0; font-size: 14px; margin-bottom: 30px; font-style: italic; }
.charSelect { display: flex; gap: 20px; margin-bottom: 30px; flex-wrap: wrap; justify-content: center; }
.charOption {
  width: 140px; height: 180px;
  background: linear-gradient(180deg, #2a2a4a 0%, #1e1e3a 100%);
  border: 3px solid #6b5b95; border-radius: 18px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  cursor: pointer; transition: all 0.3s;
}
.charOption.selected { border-color: #ff6b8a; box-shadow: 0 0 25px rgba(255, 107, 138, 0.4); }
.charPreview { font-size: 70px; margin-bottom: 12px; }
#startBtn {
  padding: 14px 40px; font-size: 18px;
  background: linear-gradient(135deg, #ff6b8a 0%, #e94560 100%);
  color: white; border: none; border-radius: 12px; cursor: pointer;
  font-weight: bold; letter-spacing: 2px;
}

#gameUI { display: none; width: 100%; height: 100%; }
#topBar {
  height: 55px; background: linear-gradient(180deg, #2a2a4a 0%, #1e1e3a 100%);
  display: flex; justify-content: space-between; align-items: center;
  padding: 0 15px; border-bottom: 2px solid #6b5b95;
}
#moveCount { color: #ffd700; font-size: 16px; font-weight: bold; }
#sleepWarning { color: #ff6b8a; font-size: 15px; display: none; animation: blink 0.6s infinite; font-weight: bold; }
@keyframes blink { 50% { opacity: 0.3; } }

#mainArea { display: flex; height: calc(100% - 55px); }
#roomView { flex: 1; background: #12121f; position: relative; overflow: hidden; }
#room {
  width: 100%; height: 100%;
  background: linear-gradient(180deg, #2d1b4e 0%, #1a1a2e 60%, #0f0f1a 100%);
  position: relative; transition: background 0.5s;
}
#room.dark { background: linear-gradient(180deg, #0a0a15 0%, #050510 100%); }

#player {
  font-size: 45px; position: absolute;
  transition: all 0.08s linear;
  filter: drop-shadow(0 0 12px rgba(255, 107, 138, 0.4)); z-index: 10;
}
.ghost-entity {
  font-size: 50px; position: absolute;
  animation: ghostFloat 2.5s ease-in-out infinite; z-index: 5;
  filter: drop-shadow(0 0 15px rgba(200, 100, 255, 0.6));
}
@keyframes ghostFloat { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-15px) rotate(3deg); } }

#door {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 70px; height: 110px;
  background: linear-gradient(180deg, #5a4030 0%, #3a2820 100%);
  border: 3px solid #7a5a48; border-radius: 12px 12px 0 0; z-index: 2;
}
#window {
  position: absolute; top: 30px; right: 30px;
  width: 80px; height: 100px;
  background: linear-gradient(180deg, #1a1a3e 0%, #0a0a2e 100%);
  border: 4px solid #4a4a6a; border-radius: 10px; z-index: 1;
}
#lamp {
  position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
  font-size: 35px; z-index: 3;
  filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.8));
}
#lamp.off { filter: grayscale(100%) brightness(0.3); }

#breaker {
  position: absolute; bottom: 20px; left: 20px;
  width: 45px; height: 60px; background: #3a3a5a;
  border: 2px solid #5a5a7a; border-radius: 8px;
  display: none; z-index: 3; cursor: pointer;
}
#breaker.on { background: #4a6a4a; border-color: #6a8a6a; }

#sidePanel {
  width: 180px; background: linear-gradient(180deg, #2a2a4a 0%, #1e1e3a 100%);
  padding: 15px; border-left: 2px solid #6b5b95; overflow-y: auto;
}
.panelTitle { color: #ff6b8a; font-size: 16px; margin-bottom: 12px; text-align: center; font-weight: bold; }
.item {
  background: linear-gradient(135deg, #1a1a2e 0%, #12121f 100%);
  padding: 10px; margin-bottom: 10px; border-radius: 10px;
  border: 2px solid #4a4a6a; cursor: pointer;
}
.itemName { font-size: 14px; color: #ffd700; font-weight: bold; }
.itemDesc { font-size: 12px; color: #9999b0; margin-top: 4px; }

#alertBox {
  position: absolute; top: 50px; left: 50%; transform: translateX(-50%);
  background: rgba(255, 107, 138, 0.95); color: white;
  padding: 10px 20px; border-radius: 12px; font-size: 16px;
  display: none; z-index: 50; font-weight: bold;
}

#sleepScreen {
  position: absolute; width: 100%; height: 100%;
  background: rgba(5, 5, 15, 0.95); display: none;
  justify-content: center; align-items: center; flex-direction: column; z-index: 200;
}
#sleepScreen h2 { color: #ffd700; font-size: 32px; margin-bottom: 20px; }
#sleepTimer { color: #ff6b8a; font-size: 48px; font-weight: bold; }

#handbook {
  display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
  width: 85%; background: linear-gradient(180deg, #2a2a4a 0%, #1e1e3a 100%);
  border: 3px solid #6b5b95; border-radius: 18px; padding: 20px; z-index: 150;
}
#handbook h3 { color: #ff6b8a; text-align: center; margin-bottom: 15px; font-size: 20px; }
.ghostEntry { background: #1a1a2e; padding: 12px; margin-bottom: 10px; border-radius: 10px; border-left: 5px solid #ff6b8a; }
.ghostName { color: #ffd700; font-weight: bold; font-size: 15px; }
.ghostWeakness { color: #9999b0; font-size: 12px; margin-top: 4px; }
#closeHandbook { display: block; margin: 15px auto 0; padding: 8px 20px; background: #ff6b8a; color: white; border: none; border-radius: 8px; cursor: pointer; }

#controls { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 20; }
.ctrlBtn { padding: 10px 15px; background: linear-gradient(135deg, #6b5b95 0%, #533483 100%); color: white; border: none; border-radius: 10px; cursor: pointer; font-size: 14px; }

#gameOverScreen, #winScreen {
  position: absolute; width: 100%; height: 100%;
  background: rgba(5, 5, 15, 0.98); display: none;
  justify-content: center; align-items: center; flex-direction: column; z-index: 300;
}
#gameOverScreen h2 { color: #ff6b8a; font-size: 40px; margin-bottom: 20px; }
#winScreen h2 { color: #ffd700; font-size: 36px; margin-bottom: 15px; }
.restartBtn { padding: 12px 30px; background: #ff6b8a; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; }
</style>
</head>
<body>
<div id="gameContainer">
  <div id="startScreen">
    <h1>🏚️ 幽灵公寓</h1>
    <div class="subtitle">可爱又可怕的夜晚开始了...</div>
    <div class="charSelect">
      <div class="charOption" data-gender="female" onclick="selectChar('female')">
        <div class="charPreview">🖤👧</div><div>黑暗洛丽塔</div>
      </div>
      <div class="charOption" data-gender="male" onclick="selectChar('male')">
        <div class="charPreview">🖤👦</div><div>暗黑绅士</div>
      </div>
    </div>
    <button id="startBtn" onclick="startGame()">开始游戏</button>
  </div>

  <div id="gameUI">
    <div id="topBar">
      <div id="moveCount">移动次数: 2/2</div>
      <div id="sleepWarning">⚠️ 需要休息！</div>
      <div>第 <span id="dayCount">1</span> 夜</div>
    </div>
    <div id="mainArea">
      <div id="roomView">
        <div id="room">
          <div id="lamp">💡</div>
          <div id="window"></div>
          <div id="door"></div>
          <div id="breaker" onclick="fixBreaker()"></div>
          <div id="player">👧</div>
        </div>
        <div id="alertBox"></div>
        <div id="hint" style="position:absolute;bottom:70px;left:50%;transform:translateX(-50%);color:#666680;font-size:12px;">方向键移动角色</div>
        <div id="controls">
          <button class="ctrlBtn" onclick="showHandbook()">📖 手册</button>
          <button class="ctrlBtn" onclick="moveToRoom()">🚪 换房</button>
        </div>
      </div>
      <div id="sidePanel">
        <div class="panelTitle">🎒 道具</div>
        <div class="item" onclick="useItem('bell')">
          <div class="itemName">🔔 铃铛</div>
          <div class="itemDesc">驱散铃音幽灵</div>
        </div>
        <div class="item" onclick="useItem('butterfly')">
          <div class="itemName">🎀 蝴蝶结</div>
          <div class="itemDesc">诱饵幽灵</div>
        </div>
      </div>
    </div>
  </div>

  <div id="sleepScreen">
    <h2>😴 需要休息</h2>
    <div id="sleepTimer">30</div>
  </div>

  <div id="handbook">
    <h3>📖 幽灵手册</h3>
    <div class="ghostEntry"><div class="ghostName">🔔 铃音幽灵</div><div class="ghostWeakness">用铃铛驱散</div></div>
    <div class="ghostEntry"><div class="ghostName">🧟 诱饵幽灵</div><div class="ghostWeakness">用蝴蝶结吸引</div></div>
    <div class="ghostEntry"><div class="ghostName">⚡ 断路幽灵</div><div class="ghostWeakness">修好电闸开灯</div></div>
    <button id="closeHandbook" onclick="closeHandbook()">关闭</button>
  </div>

  <div id="gameOverScreen">
    <h2>💀 游戏结束</h2>
    <p>幽灵抓住了你...</p >
    <button class="restartBtn" onclick="location.reload()">重新开始</button>
  </div>

  <div id="winScreen">
    <h2>🎉 恭喜通关</h2>
    <p>你成功逃出幽灵公寓</p >
    <button class="restartBtn" onclick="location.reload()">再玩一次</button>
  </div>
</div>

<script>
let selectedGender = 'female';
let moveLeft = 2;
let day = 1;
let isDark = false;

function selectChar(gender){
  selectedGender = gender;
  document.querySelectorAll('.charOption').forEach(el=>el.classList.remove('selected'));
  event.currentTarget.classList.add('selected');
  document.getElementById('player').innerText = gender==='female' ? '👧' : '👦';
}
function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('gameUI').style.display = 'block';
}
function showHandbook(){
  document.getElementById('handbook').style.display = 'block';
}
function closeHandbook(){
  document.getElementById('handbook').style.display = 'none';
}
function useItem(name){
  if(name==='bell') showAlert('铃铛驱散了铃音幽灵！');
  if(name==='butterfly') showAlert('蝴蝶结吸引走窗户幽灵！');
}
function fixBreaker(){
  if(isDark){
    document.getElementById('room').classList.remove('dark');
    document.getElementById('lamp').classList.remove('off');
    isDark = false;
    document.getElementById('breaker').style.display = 'none';
    showAlert('电闸修好，灯光恢复！');
  }
}
function showAlert(txt){
  let box = document.getElementById('alertBox');
  box.innerText = txt;
  box.style.display = 'block';
  setTimeout(()=>box.style.display='none',2000);
}
function moveToRoom(){
  if(moveLeft<=0){
    showAlert('本夜移动次数用完！');
    return;
  }
  moveLeft--;
  document.getElementById('moveCount').innerText = `移动次数: ${moveLeft}/2`;
  showAlert('你换到了新房间');
}
document.addEventListener('keydown',function(e){
  let p = document.getElementById('player');
  let left = parseFloat(p.style.left) || 200;
  let top = parseFloat(p.style.top) || 200;
  const step = 25;
  if(e.key === 'ArrowLeft') p.style.left = (left-step)+'px';
  if(e.key === 'ArrowRight') p.style.left = (left+step)+'px';
  if(e.key === 'ArrowUp') p.style.top = (top-step)+'px';
  if(e.key === 'ArrowDown') p.style.top = (top+step)+'px';
});
window.onload = function(){
  document.querySelector('.charOption').classList.add('selected');
}
</script>
</body>
</html>
